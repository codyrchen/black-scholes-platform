[project]
name = "black-scholes-platform"
version = "2.0.0"
description = "Options interview trainer built on a tested Black-Scholes pricing library"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: pydantic Field(...) defaults are intended.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Load .env before importing the app so settings see it.
"app.py" = ["E402"]
